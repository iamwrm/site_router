<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Focus timer · Private sites</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="../">Private sites</a>
    <nav aria-label="Main navigation">
      <a href="../">Home</a>
      <a href="./" aria-current="page">Demo</a>
      <a href="../time/">Time</a>
    </nav>
  </header>
  <main>
    <section class="intro">
      <h1>Focus timer</h1>
      <p>Choose a duration and start a session. Pause or reset at any time.</p>
    </section>
    <section class="panel timer" aria-label="Focus session">
      <div class="timer-settings">
        <label for="duration">Duration</label>
        <select id="duration">
          <option value="300">5 minutes</option>
          <option value="900">15 minutes</option>
          <option value="1500" selected>25 minutes</option>
        </select>
      </div>
      <div id="clock" class="clock" role="timer" aria-label="Time remaining">25:00</div>
      <div class="timer-actions">
        <button id="toggle" type="button">Start session</button>
        <button id="reset" class="secondary" type="button">Reset</button>
      </div>
      <p id="message" class="hint" role="status">Ready when you are.</p>
    </section>
    <noscript><p class="error">Enable JavaScript to use the timer.</p></noscript>
  </main>
  <footer><span>Runs in your browser.</span><span>Private HTTPS</span></footer>
</body>
</html>
